<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b141a">
  <title>EAH // Cuadros Artísticos</title>
  <link rel="icon" href="imagenes/logo01_Cuadros_EAH.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="imagenes/icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="cuadros-eah.css">
</head>

<body>

  <div id="app">

    <!-- ================= HEADER FIJO ================= -->
    <header class="header">
      <img class="logo-mini" src="imagenes/logo01_Cuadros_EAH.png" alt="EAH" onerror="this.style.display='none'">
      <h1 id="header-titulo">CHAT CLIENTE</h1>
      <button id="btn-compartir" class="btn-compartir" type="button" aria-label="Compartir">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z" />
        </svg>
      </button>
    </header>

    <!-- ================= PANTALLA 1: ENCUESTA ================= -->
    <section id="pantalla-encuesta" class="pantalla activa">
      <main class="contenido" id="chat-encuesta"></main>
      <footer class="panel-botones" id="botones-encuesta"></footer>
    </section>

    <!-- ================= PANTALLA 2: GALERÍA ================= -->
    <section id="pantalla-galeria" class="pantalla">
      <main class="contenido" id="contenido-galeria"></main>
      <footer class="panel-botones" id="botones-galeria"></footer>
    </section>

    <!-- ================= PANTALLA 3: FORMULARIO ================= -->
    <section id="pantalla-formulario" class="pantalla">
      <main class="contenido" id="contenido-formulario"></main>
      <footer class="panel-botones" id="botones-formulario"></footer>
    </section>
    <footer style="text-align:center; padding: 8px; font-size: 10px; color: #8696a0; background: #202c33;">
      © 2026 EAH Cuadros Artísticos · Marca registrada IMPI 2142690 · Todos los derechos reservados
    </footer>
  </div>

  <script src="cuadros-eah.js"></script>
</body>

</html>
